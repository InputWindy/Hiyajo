<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Json — API 文档</title>
<style>
	:root {
		--bg: #14181f; --panel: #1b2130; --code-bg: #0d1117;
		--text: #d8e1f0; --muted: #8b96a8; --accent: #5b8dd9;
		--border: #2c3444; --border-strong: #3d4a61;
		--kw: #ff7b72; --type: #79c0ff; --field: #e6c07b;
	}
	* { box-sizing: border-box; }
	body { margin:0; padding:32px 40px; background:var(--bg); color:var(--text);
		font-family:"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.7; max-width:1040px; }
	h1 { font-size:28px; border-bottom:2px solid var(--border-strong); padding-bottom:12px; }
	h2 { font-size:20px; margin-top:32px; text-transform:uppercase; letter-spacing:1px;
		border-bottom:1px solid var(--border); padding-bottom:6px; color:var(--accent); }
	.panel { background:var(--panel); border:1px solid var(--border); border-radius:8px;
		padding:20px 24px; margin:16px 0; border-left:4px solid var(--accent); }
	.class-name { font-family:Consolas,"Cascadia Code",monospace; font-size:20px; font-weight:600; }
	.badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px;
		background:#2a3346; color:var(--muted); margin-left:8px; vertical-align:middle; }
	code { font-family:Consolas,"Cascadia Code",monospace; background:var(--code-bg);
		padding:2px 6px; border-radius:4px; }
	.kw { color:var(--kw); } .type { color:var(--type); } .field { color:var(--field); }
	table { width:100%; border-collapse:collapse; margin:12px 0; }
	th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
	th { color:var(--muted); font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; }
	.signature { font-family:Consolas,"Cascadia Code",monospace; }
</style>
</head>

<h1>Json — API</h1>

<div class="panel">
	<div><span class="class-name">FJson</span><span class="badge">class</span><span class="badge">singleton</span></div>
	<p style="color:var(--muted)">JSON 扩展（nlohmann/json）。纯单例类型提供者，header-only，无生命周期。</p>
</div>

<div class="panel">
	<div><span class="class-name">FJsonValue</span><span class="badge">type alias</span></div>
	<p style="color:var(--muted)"><code>using FJsonValue = nlohmann::json;</code> —— 消费者使用此类型的 JSON 值。</p>
</div>
