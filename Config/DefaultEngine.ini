[ConsoleVariables]
r.Window.Width=100
r.Window.Height=100
; Pipeline depth: how many frames the graph lets overlap (the phase ring's K), one process-wide
; value. The host reads it BEFORE the first frame graph is built (ExampleEngine::PreMain) and the
; first FFrameGraph construction seals it for the rest of the process.
;
; CHANGING IT REQUIRES A RESTART. Every K-deep ring (the graph's phases, the RHI's per-slot fence /
; acquire semaphore / frame command buffer, the staging and render-list buckets, the camera-constant
; ring, the platform input ring) is sized at Initialize from this value and never re-sized. A
; runtime re-configuration is a SEPARATE, later change (a safe-point reconfiguration protocol);
; until that exists this number is read once, at startup.
r.FramesInFlight=3
